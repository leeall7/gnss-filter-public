# GNSS Filter — дзеркало ефемерид (v11.8.4; v13.1.3 — накопичення за добу й прибирання старих запусків).
# Покласти в публічний репозиторій gnss-filter-public:
#   .github/workflows/ephem-mirror-2.yml   (саме під цією назвою — так файл уже називається в репозиторії; інструкція —
#   EPHEM_MIRROR_SETUP.md у пакеті застосунку)
#
# Щогодини:
#  1) зведені файли IGS за сьогодні й учора (UTC) — BRDC00WRD (BKG) і BRDM00DLR (DLR) — з першого архіву, що віддасть
#     цілий RINEX: BKG, IGN (HTTPS), ESA GSSC (FTP, тека дня — там лише закриті дні). З 07.10.2026 BKG поза мережею
#     (IGSMAIL-8764), IGN теж не відповідає;
#  2) ВЛАСНИЙ зведений файл BRDC00GNF_S_<день>0000_01D_MN.rnx.gz — з щогодинних навігаційних файлів європейських станцій
#     IGS на ESA GSSC за останні 3 години. Береться лише запис, який дослівно однаковий щонайменше у двох станцій (захист
#     від помилки декодування на одній станції). Супутники — саме ті, що видно над Україною; свіжість — 1–2 год;
#  3) усе це — без змін (крім власного BRDC00GNF) у реліз ephem-latest (попередній випуск, не «latest») і в гілку ephem
#     (з неї ті самі файли віддають raw.githubusercontent.com і cdn.jsdelivr.net). Незмінений файл не перевикладається
#     (застосунок отримує 304). Старші за вчора файли прибираються.
#  4) v13.1.3: BRDC00GNF за сьогодні НАКОПИЧУЄТЬСЯ: до нових записів (останні 3 год станцій) додаються всі записи вже
#     викладеного сьогоднішнього файла. GitHub запускає розклад «щогодини» лише ~5 разів на добу (12.10.2026: з 08:09 UTC до
#     13:28 — жодного), а зведення лише за 3 год між рідкими запусками лишало застосунок без жодної чинної ефемериди.
#     Galileo (новий запис кожні 10 хв) — щонайбільше один запис на годину на кожне джерело (I/NAV, F/NAV): розмір файла.
#  5) v13.1.3: запуски цієї задачі (і ephem-probe) старші за 2 доби видаляються — історія Actions не росте.
#  6) v13.1.16 (аудит етапу 4): денні файли IGS справді викладаються (перевірка RINEX під pipefail, А4-1); запуск без
#     сьогоднішнього BRDC00GNF — червоний (А4-3).
# FTP і без шифрування — лише тут, у дата-центрі GitHub; телефон FTP не качає. NASA — не використовується (рішення).
# Дані: International GNSS Service (IGS), https://igs.org, і ESA GSSC — відкриті, за умовами IGS (з посиланням на джерело).
name: ephem-mirror

# v13.1.5 (12.10.2026): ГОЛОВНИЙ запуск — зовнішній будильник cron-job.org щогодини о :15 UTC: POST
#   https://api.github.com/repos/leeall7/gnss-filter-public/actions/workflows/<ім'я цього файла>/dispatches  {"ref":"main"}
#   з токеном (fine-grained, лише цей репозиторій, лише Actions: write — коду змінити не може). Розклад GitHub нижче — лише
#   запасний (його запуски GitHub пропускає: 12.10 при розкладі 4 рази на годину — ~5 запусків на добу).
on:
  schedule:
    - cron: '45 * * * *'      # запасний: щогодини о :45 UTC (головний — будильник о :15; разом свіжість ≤ ~1 год)
  workflow_dispatch:            # будильник cron-job.org і ручний запуск (Actions → ephem-mirror → Run workflow)
  repository_dispatch:          # v13.1.3: інший спосіб для будильника (POST /repos/…/dispatches, type ephem; токен ширший)
    types: [ephem]

permissions:
  contents: write
  actions: write                # v13.1.3: видалення старих запусків

concurrency:
  group: ephem-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ephem-latest
    steps:
      - name: Release ephem-latest
        shell: bash
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Ephemeris mirror (IGS broadcast navigation)" \
              --notes "Unchanged copies of the IGS merged broadcast navigation files BRDC00WRD (BKG) and BRDM00DLR (DLR) from the IGS data centres BKG, IGN and ESA GSSC, plus BRDC00GNF: our own merge of hourly navigation files of European IGS stations (ESA GSSC), only records identical at two or more stations. Today and yesterday (UTC), refreshed hourly for GNSS Filter. Data: International GNSS Service (IGS), https://igs.org, and ESA GSSC, under the IGS Data and Product Terms of Use."
          fi

      - name: Daily IGS files (BKG, IGN, ESA)
        shell: bash
        run: |
          set -u
          mkdir -p out
          : > keep.txt
          dead=" "      # архіви, що в цьому запуску не з'єднались (DNS, з'єднання, тайм-аут, TLS) — далі не чіпаємо
          for back in 0 1; do
            Y=$(date -u -d "-$back day" +%Y); D=$(date -u -d "-$back day" +%j)
            echo "BRDC00GNF_S_${Y}${D}0000_01D_MN.rnx.gz" >> keep.txt
            for prod in BRDC00WRD BRDM00DLR; do
              name="${prod}_S_${Y}${D}0000_01D_MN.rnx.gz"
              echo "$name" >> keep.txt
              got=""
              for base in "https://igs.bkg.bund.de/root_ftp/IGS/BRDC/$Y/$D" \
                          "https://igs.ign.fr/pub/igs/data/$Y/$D" \
                          "ftp://gssc.esa.int/gnss/data/daily/$Y/$D"; do
                h="${base#*://}"; h="${h%%/*}"
                case "$dead" in *" $h "*) continue ;; esac
                rm -f "out/$name.tmp"
                rc=0
                curl -fsSL --retry 1 --retry-delay 5 --connect-timeout 20 --max-time 180 \
                     -A "GnssFilter-ephem-mirror" -o "out/$name.tmp" "$base/$name" 2>/dev/null || rc=$?
                case "$rc" in
                  6|7|28|35) dead="$dead$h "; echo "не з'єднався ($rc): $h — далі в цьому запуску пропускаю" ;;
                esac
                if [ "$rc" -eq 0 ]; then
                  # лише справжній RINEX: цілий gzip, не крихітний, перший рядок — заголовок RINEX
                  # v13.1.16 (аудит етапу 4, А4-1): `shell: bash` у GitHub — це `bash -eo pipefail`; head закривається після першого
                  # рядка, zcat великого файла дістає SIGPIPE (код 141), і з pipefail умова була хибною для КОЖНОГО справжнього файла
                  # («не RINEX») — денні BRDC00WRD / BRDM00DLR на дзеркало не потрапляли з 11.8.4. Код zcat тут не важить (gzip -t вище).
                  if gzip -t "out/$name.tmp" 2>/dev/null && [ "$(stat -c %s "out/$name.tmp")" -gt 1000 ] \
                     && { zcat "out/$name.tmp" 2>/dev/null || true; } | head -n 1 | grep -q "RINEX VERSION / TYPE"; then
                    mv "out/$name.tmp" "out/$name"; got="$base"; break
                  fi
                  echo "не RINEX: $base/$name"
                fi
              done
              rm -f "out/$name.tmp"
              if [ -n "$got" ]; then echo "є: $name з $got"; else echo "немає: $name"; fi
            done
          done

      - name: Today's merge so far (accumulate)
        shell: bash
        run: |
          # v13.1.3: уже викладений сьогоднішній BRDC00GNF — його записи лишаються в новому (рідкі запуски розкладу GitHub)
          mkdir -p prevgnf
          name="BRDC00GNF_S_$(date -u +%Y%j)0000_01D_MN.rnx.gz"
          # «файла немає» (перший запуск доби) і «не вдалось прочитати» — різне: при збої накопичене не перезаписуємо
          if ! names=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null); then
            echo "реліз не прочитано — власний зведений файл цього разу не оновлюю"; touch prevgnf/.unknown
          elif printf '%s\n' "$names" | grep -qxF "$name"; then
            if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -D prevgnf >/dev/null 2>&1; then
              echo "є: $name — записи лишаються"
            else
              echo "не завантажено: $name — власний зведений файл цього разу не оновлюю"; touch prevgnf/.unknown
            fi
          else
            echo "немає: $name (перший запуск доби)"
          fi

      - name: Merge hourly files of European stations (ESA GSSC)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt, ftplib, gzip, io, re, socket, sys
          HOST = "gssc.esa.int"
          # країни (код у назві станції): Європа й найближче — супутники ті самі, що над Україною
          EU = set("AUT BEL BGR BIH CHE CYP CZE DEU DNK ESP EST FIN FRA GBR GEO GRC HRV HUN IRL ISL ITA LTU LUX LVA "
                   "MDA MKD MLT MNE NLD NOR POL PRT ROU SRB SVK SVN SWE TUR UKR".split())
          NAME = re.compile(r"^([A-Z0-9]{4})(\d{2})([A-Z]{3})_R_\d{11}_01H_MN\.rnx\.gz$")
          MAX_PER_HOUR, HOURS, MIN_STATIONS = 30, 3, 2
          KEEP_SYS = "GECJI"               # GLONASS і SBAS застосунок не вживає — не беремо (і різна довжина записів 3.04/3.05)
          OLD_MSG = ("LNAV", "INAV", "FNAV", "D1", "D2")   # RINEX 4: лише повідомлення з будовою запису RINEX 3
          now = dt.datetime.now(dt.timezone.utc)
          socket.setdefaulttimeout(60)
          import os
          if os.path.exists("prevgnf/.unknown"):
              # v13.1.3: сьогоднішній файл не прочитано (мережа / GitHub) — нове зведення лише за 3 год затерло б накопичене
              print("попередній сьогоднішній файл не прочитано — власний зведений файл цього разу не оновлюю")
              sys.exit(0)

          def label(content, lab):
              return content[:60].ljust(60) + lab

          def parse(text):
              lines = text.splitlines()
              hdr, end = [], -1
              for i, l in enumerate(lines):
                  hdr.append(l.rstrip())
                  if l[60:].startswith("END OF HEADER"):
                      end = i
                      break
              if end < 0 or not hdr[0][60:].startswith("RINEX VERSION"):
                  return None
              recs, cur, skip = [], None, False
              for l in lines[end + 1:]:
                  if l.startswith(">"):                # RINEX 4: «> EPH G01 LNAV», «> ION …», «> STO …»
                      if cur:
                          recs.append(cur)
                      cur = None
                      f = l.split()
                      skip = not (len(f) >= 4 and f[1] == "EPH" and f[3] in OLD_MSG)
                      continue
                  if len(l) >= 4 and l[0] in "GRECJIS" and l[1:3].strip().isdigit() and l[3] == " ":
                      if cur:
                          recs.append(cur)
                      cur = None if (skip or l[0] not in KEEP_SYS) else [l.rstrip()]
                      skip = False
                  elif cur is not None and l.strip():
                      cur.append(l.rstrip())
              if cur:
                  recs.append(cur)
              return hdr, recs

          try:
              ftp = ftplib.FTP(HOST, timeout=60)
              ftp.login()
          except Exception as e:
              print(f"ESA FTP недоступний: {e} — власного зведеного файла не буде")
              sys.exit(0)

          files = {}                       # (станція, година) -> текст
          newest = None                    # остання година з даними — у заголовок (той самий вхід → той самий файл)
          for k in range(1, HOURS + 1):
              t = now - dt.timedelta(hours=k)
              d = f"/gnss/data/hourly/{t:%Y}/{t.timetuple().tm_yday:03d}/{t:%H}/"
              try:
                  names = ftp.nlst(d)
              except Exception as e:
                  print(f"{d}: немає ({e})")
                  continue
              names = sorted(n.rsplit("/", 1)[-1] for n in names)
              picked = [n for n in names if NAME.match(n) and NAME.match(n).group(3) in EU][:MAX_PER_HOUR]
              ok = 0
              for n in picked:
                  buf = io.BytesIO()
                  try:
                      ftp.retrbinary("RETR " + d + n, buf.write)
                      files[(n[:9], d)] = gzip.decompress(buf.getvalue()).decode("ascii", "replace")
                      ok += 1
                  except Exception as e:
                      print(f"{d}{n}: {e}")
              print(f"{d}: європейських станцій {len(picked)}, завантажено {ok}")
              if ok and newest is None:
                  newest = t.replace(minute=0, second=0, microsecond=0)
          try:
              ftp.quit()
          except Exception:
              pass

          if not files:
              # v13.1.3: нових годинних файлів немає — сьогоднішній файл лишається як є (раніше сюди не доходило: без файлів
              # не було й заголовків; тепер заголовок дає попередній файл, а «newest» — ні)
              print("нових годинних файлів станцій немає — сьогоднішній зведений файл лишається")
              sys.exit(0)
          support, first, headers = {}, {}, []
          # v13.1.3: записи вже викладеного сьогоднішнього файла — уже підтверджені двома станціями
          import glob, os
          prev_n, prev_headers = 0, []
          for fn in sorted(glob.glob(os.path.join("prevgnf", "*.rnx.gz"))):
              try:
                  p = parse(gzip.decompress(open(fn, "rb").read()).decode("ascii", "replace"))
              except Exception as e:
                  print(f"{fn}: не прочитано ({e})")
                  continue
              if not p:
                  continue
              hdr, recs = p
              prev_headers.append(hdr)        # заголовок попереднього — останнім (свіжі ION / поправки часу — зі станцій)
              for r in recs:
                  key = "\n".join(x.replace("D", "E") for x in r)
                  support.setdefault(key, set()).update(("~prev1", "~prev2"))
                  first.setdefault(key, r)
                  prev_n += 1
          print(f"з попереднього сьогоднішнього файла: записів {prev_n}")
          for (sta, _), text in files.items():
              p = parse(text)
              if not p:
                  continue
              hdr, recs = p
              headers.append(hdr)
              for r in recs:
                  key = "\n".join(x.replace("D", "E") for x in r)      # D/E у показнику — те саме число
                  support.setdefault(key, set()).add(sta)
                  first.setdefault(key, r)
          headers += prev_headers
          kept = [first[k] for k, s in support.items() if len(s) >= MIN_STATIONS]
          # v13.1.3: Galileo — щонайбільше один запис на годину для кожного супутника й джерела (I/NAV / F/NAV): за добу
          # накопичення інакше ~6 тис. записів; найближча ефемерида тоді не далі 30 хв (похибка < 0,5 м на 0–3 год)
          def gal_src(r):
              try:
                  return float(r[5][23:42].replace("D", "E"))
              except Exception:
                  return None
          thin, seen = [], set()
          for r in sorted(kept, key=lambda r: (r[0][:3], r[0][4:23])):
              if r[0][0] == "E":
                  k = (r[0][:3], r[0][4:17], gal_src(r))
                  if k in seen:
                      continue
                  seen.add(k)
              thin.append(r)
          kept = thin
          stations = {sta for (sta, _) in files}         # без «~prev» — це не станції
          by_sys = {}
          for r in kept:
              by_sys[r[0][0]] = by_sys.get(r[0][0], 0) + 1
          print(f"станцій {len(stations)}, записів усього {len(support)}, підтверджених >= {MIN_STATIONS} станціями {len(kept)}: {by_sys}")
          if not headers or by_sys.get("G", 0) + by_sys.get("E", 0) < 10:
              print("замало підтверджених записів GPS/Galileo — власний зведений файл не викладаю")
              sys.exit(0)

          # заголовок — RINEX 3.04 (записи GPS/Galileo/BeiDou/QZSS/IRNSS у 3.04–3.05 і в LNAV/INAV/FNAV/D1/D2 RINEX 4
          # однакові); іоносфера й поправки часу — із заголовка файла RINEX 3, якщо такий був
          # v13.1.3: спершу — RINEX 3 з іоносферою (Klobuchar), далі будь-який RINEX 3; заголовок попереднього файла — останній
          r3 = [h for h in headers if h[0][:9].strip().startswith("3")]
          base = next((h for h in r3 if any(l[60:].startswith("IONOSPHERIC CORR") for l in h)), r3[0] if r3 else headers[0])
          out = ["     3.04           N: GNSS NAV DATA    M: MIXED            RINEX VERSION / TYPE",
                 label(f"{'gnss-filter-merge':<20}{'gnss-filter-public':<20}{newest:%Y%m%d %H%M%S} UTC", "PGM / RUN BY / DATE"),
                 label(f"Merged hourly nav files, {len(stations)} European IGS stations", "COMMENT"),
                 label(f"(ESA GSSC), last {HOURS} h + earlier today; identical >= {MIN_STATIONS} sta", "COMMENT"),
                 label("Data: International GNSS Service (IGS), https://igs.org", "COMMENT")]
          if base[0][:9].strip().startswith("3"):
              out += [l for l in base[1:] if l[60:].startswith(("IONOSPHERIC CORR", "TIME SYSTEM CORR", "LEAP SECONDS"))]
          out.append(label("", "END OF HEADER"))
          kept.sort(key=lambda r: (r[0][4:23], r[0][:3]))
          for r in kept:
              out.extend(r)
          name = f"BRDC00GNF_S_{now:%Y}{now.timetuple().tm_yday:03d}0000_01D_MN.rnx.gz"
          with open("out/" + name, "wb") as f:
              f.write(gzip.compress(("\n".join(out) + "\n").encode("ascii"), mtime=0))
          print(f"зведено: {name}, записів {len(kept)}")
          PY

      - name: Publish to release ephem-latest
        shell: bash
        run: |
          set -u
          n=0
          for f in out/*.rnx.gz; do
            [ -f "$f" ] || continue
            name="${f#out/}"; n=$((n+1))
            # той самий файл уже викладено — не чіпати (ETag лишається, застосунок отримає 304)
            rm -rf prev && mkdir prev
            if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -D prev >/dev/null 2>&1 \
               && cmp -s "prev/$name" "$f"; then
              echo "без змін: $name"
              continue
            fi
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$f" --clobber
            echo "викладено: $name ($(stat -c %s "$f") Б)"
          done
          # прибрати з релізу все, крім сьогодні й учора
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r a; do
            [ -z "$a" ] && continue
            if ! grep -qxF "$a" keep.txt; then
              gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" -y && echo "прибрано: $a"
            fi
          done
          if [ "$n" -eq 0 ]; then
            echo "Жодного файла не отримано — ні архіви IGS, ні щогодинні файли станцій ESA."
            exit 1
          fi

      - name: Branch ephem (raw.githubusercontent.com, cdn.jsdelivr.net)
        shell: bash
        run: |
          set -u
          rm -rf br && mkdir br && cd br
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.rnx.gz' -D . >/dev/null 2>&1 || true
          if ! ls ./*.rnx.gz >/dev/null 2>&1; then echo "у релізі немає файлів — гілку не чіпаю"; exit 0; fi
          printf '%s\n' \
            "Copies of IGS broadcast navigation files and our merge BRDC00GNF (today and yesterday, UTC), refreshed hourly by ephem-mirror.yml." \
            "Data: International GNSS Service (IGS), https://igs.org, and ESA GSSC, under the IGS Data and Product Terms of Use." > README.md
          git init -q
          git config user.name "ephem-mirror"
          git config user.email "ephem-mirror@users.noreply.github.com"
          git checkout -q --orphan ephem
          git add -A
          git commit -q -m "ephemeris $(date -u +%Y-%m-%dT%H:%MZ)"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # ті самі файли вже в гілці — не перевикладати (ETag на raw і jsDelivr лишається)
          if git fetch -q --depth 1 "$url" ephem 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "гілка ephem без змін"
            exit 0
          fi
          git push -q --force "$url" HEAD:ephem
          echo "гілку ephem оновлено"
          # jsDelivr тримає гілку в кеші до 12 год — просимо оновити файли одразу
          for f in ./*.rnx.gz; do
            n="${f#./}"
            if curl -fsS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@ephem/${n}" >/dev/null; then
              echo "jsDelivr оновлено: ${n}"
            else
              echo "jsDelivr: не вдалось оновити ${n} (оновиться сам)"
            fi
          done

      - name: Today's BRDC00GNF updated
        shell: bash
        run: |
          # v13.1.16 (аудит етапу 4, А4-3): без свіжого власного зведення запуск — червоний (GitHub надішле лист), навіть коли
          # інші файли є (напр. учорашній BRDM00DLR): інакше застаріле дзеркало мовчить, як 12.10 (5+ год без чинних ефемерид).
          # Крок зведення кладе в out/ сьогоднішній BRDC00GNF (і тоді, коли він не змінився); не кладе — коли зведення цього разу не було
          # (ESA FTP недоступний, за 3 год немає годинних файлів, замало записів, сьогоднішній файл не прочитано) — тобто дзеркало не оновилось.
          if ls out/BRDC00GNF_S_*_01D_MN.rnx.gz >/dev/null 2>&1; then
            echo "BRDC00GNF є: $(ls out/BRDC00GNF_S_*_01D_MN.rnx.gz)"
          else
            echo "::error::BRDC00GNF цього разу не зведено (ESA GSSC / реліз недоступні або замало записів) — дзеркало старіє"
            exit 1
          fi

      - name: Delete old runs (ephem-mirror, ephem-probe)
        if: always()
        shell: bash
        run: |
          # v13.1.3: історія Actions — лише за 2 доби; поточний і незавершені запуски не чіпаємо
          set -u
          cutoff=$(date -u -d '-2 day' +%Y-%m-%dT%H:%M:%SZ)
          n=0
          # v13.1.7 (13.10): ім'я файла цієї задачі — з GITHUB_WORKFLOW_REF (у gnss-filter-public вона лежить як ephem-mirror-2.yml;
          # з жорстко прописаним ephem-mirror.yml старі запуски не видалялись)
          self=${GITHUB_WORKFLOW_REF%@*}; self=${self##*/}
          for wf in "$self" ephem-probe.yml; do
            ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs" -f per_page=100 --paginate \
                    -q ".workflow_runs[] | select(.status == \"completed\" and .created_at < \"$cutoff\") | .id" 2>/dev/null || true)
            for id in $ids; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1; then n=$((n+1)); fi
            done
          done
          echo "видалено старих запусків: $n (старші за $cutoff)"
