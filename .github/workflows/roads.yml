name: Build road tiles

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Рамка minlat,minlon,maxlat,maxlon (порожньо = вся Україна)'
        required: false
        default: ''
      track:
        description: 'Брати highway=track (польові/лісові дороги)'
        type: boolean
        default: true
      tolerance:
        description: 'Спрощення геометрії, м'
        required: false
        default: '2'
      tile:
        description: 'Розмір плитки, ° (0.025 — для слабких телефонів і міст)'
        required: false
        default: '0.025'
  schedule:
    - cron: '17 3 1 * *'      # першого числа щомісяця

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Де скрипти
        id: where
        run: |
          B=$(find . -name build_roads.py -not -path "*/node_modules/*" | head -1)
          V=$(find . -name verify_roads.py | head -1)
          if [ -z "$B" ] || [ -z "$V" ]; then echo "::error::не знайдено build_roads.py / verify_roads.py у репозиторії"; find . -maxdepth 3 -type d | head -50; exit 1; fi
          echo "build=$B" >> "$GITHUB_OUTPUT"; echo "verify=$V" >> "$GITHUB_OUTPUT"
          echo "build_roads: $B"; echo "verify_roads: $V"

      - name: Інструменти
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python3 -m pip install --quiet osmium numpy
          osmium --version | head -1

      - name: Витяг OSM (Geofabrik)
        run: |
          wget -q https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          wget -q https://download.geofabrik.de/europe/ukraine-latest.osm.pbf.md5
          md5sum -c ukraine-latest.osm.pbf.md5
          ls -la ukraine-latest.osm.pbf
          osmium fileinfo -e ukraine-latest.osm.pbf | grep -i -E "timestamp|Number of" || true

      - name: Лише дороги
        run: |
          osmium tags-filter ukraine-latest.osm.pbf w/highway -o ukraine-roads.osm.pbf
          ls -la ukraine-roads.osm.pbf

      - name: Доповнення (обмеження швидкості, камери, переїзди, лежачі) — для GNSS Nav iOS
        # окремий файл: ua-roads.bin не змінюється; Android, якому доповнення не потрібні, їх просто не завантажує.
        # Камери часто — окремі точки поза дорогою, тому фільтр ширший за w/highway.
        run: |
          set -e
          E=$(dirname "${{ steps.where.outputs.build }}")/build_extras.py
          VE=$(dirname "${{ steps.where.outputs.verify }}")/verify_extras.py
          osmium tags-filter ukraine-latest.osm.pbf w/highway n/highway=speed_camera n/enforcement \
            n/railway=level_crossing n/traffic_calming -o extras-src.osm.pbf
          if [ -n "${{ github.event.inputs.bbox }}" ]; then
            python3 "$E" extras-src.osm.pbf region-extras.bin --bbox "${{ github.event.inputs.bbox }}"
            python3 "$VE" region-extras.bin | tee region-extras.txt
          else
            python3 "$E" extras-src.osm.pbf ua-extras.bin
            python3 "$VE" ua-extras.bin | tee ua-extras.txt
            python3 "$E" extras-src.osm.pbf kyiv-extras.bin --bbox 49.3,29.2,51.6,32.2
            python3 "$VE" kyiv-extras.bin | tee kyiv-extras.txt
          fi

      - name: Контейнер
        env:
          BBOX: ${{ github.event.inputs.bbox }}
          TRACK: ${{ github.event.inputs.track }}
          TOL: ${{ github.event.inputs.tolerance }}
          TILE: ${{ github.event.inputs.tile }}
        run: |
          set -e
          B="${{ steps.where.outputs.build }}"; V="${{ steps.where.outputs.verify }}"
          ARGS="--tolerance ${TOL:-2} --tile ${TILE:-0.025}"
          if [ "${TRACK}" = "false" ]; then ARGS="$ARGS --no-track"; fi
          if [ -n "${BBOX}" ]; then
            python3 "$B" ukraine-roads.osm.pbf region-roads.bin $ARGS --bbox "${BBOX}"
            python3 "$V" region-roads.bin | tee region-roads.txt
          else
            python3 "$B" ukraine-roads.osm.pbf ua-roads.bin $ARGS
            python3 "$V" ua-roads.bin | tee ua-roads.txt
            python3 "$B" ukraine-roads.osm.pbf kyiv-roads.bin $ARGS --bbox 49.3,29.2,51.6,32.2
            python3 "$V" kyiv-roads.bin | tee kyiv-roads.txt
          fi
          ls -la *.bin

      - name: Дата
        id: d
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Маніфест для GNSS Nav iOS (розміри й SHA-256)
        # лише для повної України; Android його не читає
        if: ${{ github.event.inputs.bbox == '' || github.event.inputs.bbox == null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          # Маніфест доповнюється, а не перезаписується: Україну оновлює roads.yml, Ізраїль — roads-il.yml.
          import hashlib, json, os, datetime, subprocess
          def ref(f):
              return {'file': f, 'size': os.path.getsize(f), 'sha256': hashlib.sha256(open(f, 'rb').read()).hexdigest()}
          old = {'regions': []}
          if subprocess.run(['gh', 'release', 'download', 'roads-latest', '-p', 'manifest.json', '-O', 'manifest-old.json', '--clobber']).returncode == 0:
              try: old = json.load(open('manifest-old.json', encoding='utf-8'))
              except Exception: pass
          mine = {'id': 'UA', 'name': 'Уся Україна', 'bbox': [22.1, 44.3, 40.3, 52.4], 'files': [ref('ua-roads.bin'), ref('ua-extras.bin')]}
          regs = [r for r in old.get('regions', []) if r['id'] != mine['id']] + [mine]
          m = {'schema': 1, 'module': 'roads',
               'generated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
               'license': 'ODbL 1.0 — © OpenStreetMap contributors', 'regions': sorted(regs, key=lambda r: r['id'])}
          json.dump(m, open('manifest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print(json.dumps(m, ensure_ascii=False)[:500])
          PY

      - name: Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: road-tiles
          path: |
            *.bin
            *.txt
          retention-days: 30

      - name: Release
        # рамка (bbox) — як prerelease: «latest» його не бере, і застосунок далі тягне повну карту.
        # make_latest — явно: у репозиторії є й інші щомісячні релізи (мапи, маршрути для iOS), і без
        # цього GitHub робив «Latest» один із них — releases/latest/download/ua-roads.bin давав 404.
        uses: softprops/action-gh-release@v2
        with:
          make_latest: ${{ (github.event.inputs.bbox == '' || github.event.inputs.bbox == null) && 'true' || 'false' }}
          prerelease: ${{ github.event.inputs.bbox != '' && github.event.inputs.bbox != null }}
          tag_name: roads-${{ steps.d.outputs.d }}-${{ github.run_number }}
          name: Дороги OSM для прив'язки, ${{ steps.d.outputs.d }}
          body: |
            Дані © OpenStreetMap contributors, ODbL 1.0 (див. LICENSE-DATA). Джерело — Geofabrik ukraine-latest.
            Формат — tools/roads/FORMAT.md. Зведення — у *.txt.
          files: |
            *.bin
            *.txt

      - name: Постійна адреса roads-latest
        # Застосунок (11.4.2+) качає з releases/download/roads-latest/ua-roads.bin — ця адреса не
        # залежить від того, який реліз GitHub вважає «Latest». Лише повна Україна (без рамки).
        if: ${{ github.event.inputs.bbox == '' || github.event.inputs.bbox == null }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: roads-latest
          name: Дороги OSM для прив'язки — поточні (roads-latest)
          make_latest: 'false'
          overwrite_files: true
          body: |
            Завжди найсвіжіша схема доріг (оновлюється щомісяця). Дані © OpenStreetMap contributors,
            ODbL 1.0 (див. LICENSE-DATA). Джерело — Geofabrik ukraine-latest. Формат — tools/roads/FORMAT.md.
          files: |
            ua-roads.bin
            ua-roads.txt
            kyiv-roads.bin
            kyiv-roads.txt
            ua-extras.bin
            ua-extras.txt
            kyiv-extras.bin
            kyiv-extras.txt
            manifest.json
