# GNSS Filter — дзеркало ефемерид (v11.8.4). Покласти в публічний репозиторій gnss-filter-public:
#   .github/workflows/ephem-mirror.yml
# Щогодини бере зведені навігаційні файли IGS за сьогодні й учора (UTC) — BRDC00WRD (BKG) і BRDM00DLR (DLR) — з першого
# архіву, що віддасть цілий RINEX: BKG, IGN (HTTPS), ESA GSSC, Ухань, KASI (FTP — лише тут, у дата-центрі GitHub; телефон
# FTP не качає), — і викладає їх БЕЗ ЗМІН, з тими самими назвами, у реліз ephem-latest (попередній випуск, не
# «latest») і в гілку ephem (з неї ті самі файли віддають raw.githubusercontent.com і CDN cdn.jsdelivr.net — ще два
# незалежні шляхи). Незмінений файл не перевикладається — застосунок тоді отримує «не змінився» (304) і нічого не качає.
# Старші за вчора файли прибираються. Застосунок (EphemFetch, з 11.8.4) бере файли з цих трьох шляхів і з самих архівів
# BKG/IGN — першим те джерело, що спрацювало востаннє: з 07.10.2026 архіви IGS з українських мереж не відповідають.
# Дані: International GNSS Service (IGS), https://igs.org — відкриті, за умовами IGS (з посиланням на джерело).
name: ephem-mirror

on:
  schedule:
    - cron: '23 * * * *'      # щогодини о :23 UTC (не на :00 — менше черги)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ephem-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ephem-latest
    steps:
      - name: Release ephem-latest
        shell: bash
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Ephemeris mirror (IGS broadcast navigation)" \
              --notes "Unchanged copies of the IGS merged broadcast navigation files BRDC00WRD (BKG) and BRDM00DLR (DLR), taken from the IGS data centres BKG (igs.bkg.bund.de) and IGN (igs.ign.fr) and refreshed hourly for GNSS Filter. Today and yesterday (UTC) only. Data: International GNSS Service (IGS), https://igs.org, under the IGS Data and Product Terms of Use."
          fi

      - name: Fetch from IGS and publish
        shell: bash
        run: |
          set -u
          mkdir -p out
          : > keep.txt
          ok=0
          dead=" "      # архіви, що в цьому запуску не з'єднались (DNS, з'єднання, тайм-аут, TLS) — далі не чіпаємо
          for back in 0 1; do
            Y=$(date -u -d "-$back day" +%Y); D=$(date -u -d "-$back day" +%j); YY=${Y:2:2}
            for prod in BRDC00WRD BRDM00DLR; do
              name="${prod}_S_${Y}${D}0000_01D_MN.rnx.gz"
              echo "$name" >> keep.txt
              got=""
              # BKG, IGN — HTTPS; ESA GSSC — FTP, щорічна тека brdc (IGS-DCWG-211); Ухань — FTP, тека YYp; KASI — FTP,
              # тека YYp (шлях не підтверджено документацією — не з'єднається, то й не завадить)
              for base in "https://igs.bkg.bund.de/root_ftp/IGS/BRDC/$Y/$D" \
                          "https://igs.ign.fr/pub/igs/data/$Y/$D" \
                          "ftp://gssc.esa.int/gnss/data/daily/$Y/brdc" \
                          "ftp://igs.gnsswhu.cn/pub/gps/data/daily/$Y/$D/${YY}p" \
                          "ftp://nfs.kasi.re.kr/gps/data/daily/$Y/$D/${YY}p"; do
                h="${base#*://}"; h="${h%%/*}"
                case "$dead" in *" $h "*) continue ;; esac
                rm -f "out/$name.tmp"
                rc=0
                curl -fsSL --retry 1 --retry-delay 5 --connect-timeout 20 --max-time 180 \
                     -A "GnssFilter-ephem-mirror" -o "out/$name.tmp" "$base/$name" || rc=$?
                case "$rc" in
                  6|7|28|35) dead="$dead$h "; echo "не з'єднався ($rc): $h — далі в цьому запуску пропускаю" ;;
                esac
                if [ "$rc" -eq 0 ]; then
                  # лише справжній RINEX: цілий gzip, не крихітний, перший рядок — заголовок RINEX
                  if gzip -t "out/$name.tmp" 2>/dev/null && [ "$(stat -c %s "out/$name.tmp")" -gt 1000 ] \
                     && zcat "out/$name.tmp" 2>/dev/null | head -n 1 | grep -q "RINEX VERSION / TYPE"; then
                    mv "out/$name.tmp" "out/$name"; got="$base"; break
                  fi
                  echo "не RINEX: $base/$name"
                fi
              done
              rm -f "out/$name.tmp"
              if [ -z "$got" ]; then echo "немає: $name"; continue; fi
              ok=$((ok+1))
              # той самий файл уже викладено — не чіпати (ETag лишається, застосунок отримає 304)
              rm -rf prev && mkdir prev
              if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -D prev >/dev/null 2>&1 \
                 && cmp -s "prev/$name" "out/$name"; then
                echo "без змін: $name"
                continue
              fi
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "out/$name" --clobber
              echo "викладено: $name з $got ($(stat -c %s "out/$name") Б)"
            done
          done
          # прибрати з релізу все, крім сьогодні й учора
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r a; do
            [ -z "$a" ] && continue
            if ! grep -qxF "$a" keep.txt; then
              gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" -y && echo "прибрано: $a"
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "Жодного файла не отримано — архіви IGS недоступні з GitHub або ще не сформували файл."
            exit 1
          fi

      - name: Branch ephem (raw.githubusercontent.com, cdn.jsdelivr.net)
        shell: bash
        run: |
          set -u
          rm -rf br && mkdir br && cd br
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.rnx.gz' -D . >/dev/null 2>&1 || true
          if ! ls ./*.rnx.gz >/dev/null 2>&1; then echo "у релізі немає файлів — гілку не чіпаю"; exit 0; fi
          printf '%s\n' \
            "Unchanged copies of IGS broadcast navigation files (today and yesterday, UTC), refreshed hourly by ephem-mirror.yml." \
            "Data: International GNSS Service (IGS), https://igs.org, under the IGS Data and Product Terms of Use." > README.md
          git init -q
          git config user.name "ephem-mirror"
          git config user.email "ephem-mirror@users.noreply.github.com"
          git checkout -q --orphan ephem
          git add -A
          git commit -q -m "ephemeris $(date -u +%Y-%m-%dT%H:%MZ)"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # ті самі файли вже в гілці — не перевикладати (ETag на raw і jsDelivr лишається)
          if git fetch -q --depth 1 "$url" ephem 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "гілка ephem без змін"
            exit 0
          fi
          git push -q --force "$url" HEAD:ephem
          echo "гілку ephem оновлено"
          # jsDelivr тримає гілку в кеші до 12 год — просимо оновити файли одразу
          for f in ./*.rnx.gz; do
            n="${f#./}"
            if curl -fsS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@ephem/${n}" >/dev/null; then
              echo "jsDelivr оновлено: ${n}"
            else
              echo "jsDelivr: не вдалось оновити ${n} (оновиться сам)"
            fi
          done
